
name: AWS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Push to ECR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ECR_REGISTRY: 695746118696.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: aws-cicd-pipeline
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: python -m pytest -v

      - name: Build Docker Image
        run: |
          docker build -t aws-cicd-pipeline:${IMAGE_TAG} .

      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag aws-cicd-pipeline:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker tag aws-cicd-pipeline:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

      - name: Push Docker Image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

      - name: Test ECR Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

          docker run -d --name aws-cicd-test -p 5000:5000 \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

          sleep 5

          curl --fail http://localhost:5000/health

          docker stop aws-cicd-test
          docker rm aws-cicd-test

      - name: Pipeline Success
        run: echo "CI/CD pipeline completed successfully!"
